name: Sync DNS

on:
  pull_request:
    paths:
      - "dns/zones/**"
      - "dns/sync-dns.mjs"
  workflow_dispatch:
    inputs:
      zone:
        description: "Only sync this zone's file (leave blank for all zones)"
        type: string
        default: ""
      apply:
        description: "Actually create/update records and redirect rules (unchecked = dry run only)"
        type: boolean
        default: false
      prune:
        description: "Also delete DNS records not listed in the zone file (dangerous — read the plan first; never affects redirect rules)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dns
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dns/package-lock.json

      - run: npm ci

      # Fails the job (and blocks sync below) if statement/branch/function/line
      # coverage on sync-dns.mjs drops below 80% — see dns/vitest.config.js.
      - run: npm test

  sync:
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dns
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dns/package-lock.json

      - run: npm ci

      # PRs always dry-run, regardless of the flags above (those only apply
      # to a manual workflow_dispatch run) — DNS changes never auto-apply
      # from a pull request.
      - name: Sync DNS
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.zone }}" ]; then
            ARGS="--zone ${{ inputs.zone }}"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.apply }}" = "true" ]; then
            ARGS="$ARGS --apply"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.prune }}" = "true" ]; then
            ARGS="$ARGS --prune"
          fi
          node sync-dns.mjs $ARGS
