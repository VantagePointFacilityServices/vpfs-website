name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "content/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one Pages deploy at a time; don't cancel one that's already live-deploying.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci
      - run: npm test

      # Fails if content/resources/ changed without rebuilding site/resources/.
      - run: node scripts/build-resources.mjs --check

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Pages caches every file for 10 minutes, so give each deploy's CSS/JS
      # URLs a new ?v=<commit> — otherwise a browser can run new HTML against
      # old cached JS. Only rewrites this job's checkout, never the repo.
      - name: Version asset URLs (cache busting)
        run: node site/scripts/cache-bust.mjs site "${GITHUB_SHA::8}"

      - name: Upload site/ as the Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
