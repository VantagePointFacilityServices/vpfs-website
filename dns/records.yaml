# Desired-state DNS records for vantagepointcommercial.com.au, applied by
# sync-dns.mjs against the Cloudflare API. This file is the single source
# of truth — edit it, then run the sync script (dry-run by default).
#
# Fields per record:
#   type      - A, AAAA, CNAME, TXT, MX, etc.
#   name      - fully-qualified hostname. Use the bare domain for the apex
#               (not "@" — this script doesn't expand shorthand).
#   content   - record value
#   ttl       - seconds, or 1 for "Auto" (default: 1)
#   proxied   - true = orange-cloud (Cloudflare proxy/CDN/WAF), false = grey-
#               cloud (DNS only). Default: false. See the GitHub Pages note
#               below before turning this on for the website records.
#   priority  - MX/SRV only
#
# A/AAAA/MX/TXT/SRV can have several records at the same name (e.g. the four
# GitHub Pages apex IPs below) — each is tracked independently by its exact
# content. CNAME can only have one value per name, so it's updated in place.
#
# Commented-out blocks below are real records this domain will eventually
# need, held back because they require values from a system that isn't set
# up yet. Uncomment and fill in when that system is live — don't guess the
# values.

# --- Website (GitHub Pages) — deployed by .github/workflows/deploy-website.yml ---
# DNS-only (proxied: false) at apex/www: GitHub issues its own TLS cert for
# the custom domain and needs to see the real GitHub IPs to do that. A
# `site/CNAME` file (committed alongside this) tells GitHub which custom
# domain to serve. Only switch proxied to true after GitHub's custom-domain
# HTTPS check has gone green in repo Settings > Pages — and if you do, set
# Cloudflare's SSL/TLS mode to "Full" (not "Flexible"), or you'll get a
# redirect loop.
- type: A
  name: vantagepointcommercial.com.au
  content: 185.199.108.153
  proxied: false
- type: A
  name: vantagepointcommercial.com.au
  content: 185.199.109.153
  proxied: false
- type: A
  name: vantagepointcommercial.com.au
  content: 185.199.110.153
  proxied: false
- type: A
  name: vantagepointcommercial.com.au
  content: 185.199.111.153
  proxied: false
- type: CNAME
  name: www.vantagepointcommercial.com.au
  content: vantagepointfacilityservices.github.io
  proxied: false

