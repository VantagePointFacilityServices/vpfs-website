name = "vpfs-lead-scoring-worker"
main = "worker.js"
compatibility_date = "2024-09-23"

# GHL_API_KEY is a runtime secret, not set here:
#   wrangler secret put GHL_API_KEY
# So is TURNSTILE_SECRET_KEY (optional — /lead skips the bot check without it):
#   wrangler secret put TURNSTILE_SECRET_KEY
# BOOKING_TOKEN_SECRET is a secret too (signs /gate's booking_token):
#   wrangler secret put BOOKING_TOKEN_SECRET

[vars]
# The GHL sub-account contacts are created in — required by /contacts/upsert.
# Not a secret: it also appears in the sub-account's public webhook URLs.
GHL_LOCATION_ID = "i1xCcUSRa8PDofaJ1Oyz"

# GHL calendars the website booking flow reads/books against (not secret).
CALENDAR_PRIORITY_ID = "Ugunj3x67DQlmRm2aL2h"
CALENDAR_STANDARD_ID = "FMEE7r6jwySahTZ90S0C"
BOOKING_TIMEZONE = "Australia/Brisbane"

# Cloudflare provisions and manages the DNS record for this automatically
# on deploy — do not also add it to dns/zones/*.yaml (see dns/README.md).
[[routes]]
pattern = "worker.vantagepointfacilityservices.com.au"
custom_domain = true
