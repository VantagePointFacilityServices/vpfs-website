name = "vpfs-lead-scoring-worker"
main = "worker.js"
compatibility_date = "2024-09-23"

# GHL_VPFS_API_KEY is a runtime secret, not set here:
#   wrangler secret put GHL_VPFS_API_KEY
# So is TURNSTILE_SECRET_KEY (optional — /lead skips the bot check without it):
#   wrangler secret put TURNSTILE_SECRET_KEY
# BOOKING_TOKEN_SECRET is a secret too (signs /gate's booking_token):
#   wrangler secret put BOOKING_TOKEN_SECRET

[vars]
# The GHL sub-account contacts are created in — required by /contacts/upsert.
# Not a secret: it also appears in the sub-account's public webhook URLs.
GHL_VPFS_LOCATION_ID = "i1xCcUSRa8PDofaJ1Oyz"

# The people (recruiting) GHL sub-account /apply writes to. /apply returns
# 503 if this or the GHL_VPP_API_KEY secret is missing, and never uses
# the pair above.
# Secret: wrangler secret put GHL_VPP_API_KEY
GHL_VPP_LOCATION_ID = "DqHM7ASMNC4TzLr8kia4"

# While "false", a qualifying employee applicant is shortlisted (no
# interview calendar); subcontractors always book. Set "true" to open intake.
EMPLOYEE_INTAKE_OPEN = "true"

# GHL calendars the website booking flow reads/books against (not secret).
CALENDAR_PRIORITY_ID = "Ugunj3x67DQlmRm2aL2h"
CALENDAR_STANDARD_ID = "FMEE7r6jwySahTZ90S0C"
# Group/class interview calendars in the PEOPLE sub-account (blank →
# applicants see the "we'll be in touch" fallback). The employee one is only
# offered once EMPLOYEE_INTAKE_OPEN is "true".
CALENDAR_INTERVIEW_EMPLOYEE_ID = "yhSvwfjksy7UlEWYW94A"
CALENDAR_INTERVIEW_SUBCONTRACTOR_ID = "CJrzOKAkqowJzzzlkh5w"
BOOKING_TIMEZONE = "Australia/Brisbane"

# Cloudflare provisions and manages the DNS record for this automatically
# on deploy — do not also add it to dns/zones/*.yaml (see dns/README.md).
[[routes]]
pattern = "worker.vantagepointfacilityservices.com.au"
custom_domain = true
